AWSTemplateFormatVersion: '2010-09-09'
Description: 'RentCoordinator Auto-Scaling Infrastructure with ALB Integration'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
    Description: Environment name

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: EC2 instance type

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 Key Pair for SSH access

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where instances will be launched

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of subnet IDs for Auto Scaling Group (use multiple AZs for HA)

  TargetGroupArn:
    Type: String
    Description: ARN of existing ALB Target Group
    Default: arn:aws:elasticloadbalancing:us-west-2:822812818413:targetgroup/RentCoordinator/faeeb51824fa4106

  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID of existing ALB
    Default: sg-8eb1fae9

  SecretsManagerSecretArn:
    Type: String
    Description: ARN of Secrets Manager secret containing application configuration
    Default: arn:aws:secretsmanager:us-west-2:822812818413:secret:rent-coordinator/config-zlAnNB

  GitHubRepo:
    Type: String
    Default: https://github.com/rdeforest/RentCoordinator.git
    Description: GitHub repository URL

  GitBranch:
    Type: String
    Default: main
    Description: Git branch to deploy

  MinSize:
    Type: Number
    Default: 1
    Description: Minimum number of instances in Auto Scaling Group

  MaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of instances in Auto Scaling Group

  DesiredCapacity:
    Type: Number
    Default: 1
    Description: Desired number of instances in Auto Scaling Group

Mappings:
  RegionMap:
    us-west-2:
      AMI: ami-0a5eab7419cee78d7  # Devuan daedalus amd64 (custom, 2026-03-14)

Conditions:
  IsProduction: !Equals [!Ref Environment, production]

Resources:
  # S3 Bucket for Database Backups
  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Production uses legacy name (no environment suffix for backward compatibility)
      # Staging/other environments get environment-specific buckets
      BucketName: !If
        - IsProduction
        - !Sub rent-coordinator-backups-${AWS::AccountId}
        - !Sub rent-coordinator-backups-${AWS::AccountId}-${Environment}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldBackups
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub RentCoordinator-Backups-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # IAM Role for EC2 instances
  RentCoordinatorInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub RentCoordinator-Instance-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SecretsManagerSecretArn
        - PolicyName: S3BackupAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt BackupBucket.Arn
                  - !Sub ${BackupBucket.Arn}/*
      Tags:
        - Key: Name
          Value: !Sub RentCoordinator-Instance-Role-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # Instance Profile
  RentCoordinatorInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub RentCoordinator-Instance-Profile-${Environment}
      Roles:
        - !Ref RentCoordinatorInstanceRole

  # Security Group
  RentCoordinatorSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub RentCoordinator-${Environment}
      GroupDescription: Security group for RentCoordinator instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroupId
          Description: Application port from ALB
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub RentCoordinator-SG-${Environment}
        - Key: Environment
          Value: !Ref Environment

  # Launch Template
  RentCoordinatorLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub RentCoordinator-${Environment}
      LaunchTemplateData:
        ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Arn: !GetAtt RentCoordinatorInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref RentCoordinatorSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub RentCoordinator-${Environment}
              - Key: Environment
                Value: !Ref Environment
              - Key: Application
                Value: RentCoordinator
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e

            # Logging
            exec > >(tee /var/log/user-data.log)
            exec 2>&1
            echo "Starting RentCoordinator bootstrap at $(date)"

            # Refresh package index (no full upgrade — instance is ephemeral)
            apt-get update

            # Install dependencies
            # cron — needed for the daily backup crontab line further down
            # curl is preferred over wget for downloads (Devuan AMI ships curl, not wget)
            apt-get install -y \
              git \
              curl \
              jq \
              awscli \
              build-essential \
              cron

            # Create application user
            useradd -r -m -s /bin/bash rent-coordinator || true

            # Install nvm and Node.js 24 LTS as rent-coordinator user
            sudo -u rent-coordinator bash -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash'

            # Source nvm and install Node 24
            sudo -u rent-coordinator bash -c '
              export NVM_DIR="/home/rent-coordinator/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              nvm install 24
              nvm use 24
              nvm alias default 24
              node --version
              npm --version
            '

            # Create application directory
            mkdir -p /opt/rent-coordinator
            chown rent-coordinator:rent-coordinator /opt/rent-coordinator

            # Clone repository as application user
            cd /opt/rent-coordinator
            sudo -u rent-coordinator git clone ${GitHubRepo} .
            sudo -u rent-coordinator git checkout ${GitBranch}

            # Install Node.js dependencies
            sudo -u rent-coordinator bash -c '
              export NVM_DIR="/home/rent-coordinator/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              nvm use
              npm ci --only=production
            '

            # No separate build step — client-side CoffeeScript is compiled on first npm start

            # Retrieve secrets from AWS Secrets Manager
            SECRET_JSON=$(aws secretsmanager get-secret-value \
              --secret-id ${SecretsManagerSecretArn} \
              --region ${AWS::Region} \
              --query 'SecretString' \
              --output text)

            # Create environment file
            cat > /opt/rent-coordinator/.env << 'ENVEOF'
            NODE_ENV=production
            PORT=8080
            DB_PATH=/var/lib/rent-coordinator/tenant-coordinator.db
            BACKUP_S3_BUCKET=${BackupBucket}
            BACKUP_S3_PREFIX=database/
            AWS_REGION=${AWS::Region}
            S3_BACKUP_ENABLED=true
            ENVEOF

            # Add secrets to environment file
            echo "$SECRET_JSON" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> /opt/rent-coordinator/.env

            # Secure the environment file
            chown rent-coordinator:rent-coordinator /opt/rent-coordinator/.env
            chmod 600 /opt/rent-coordinator/.env

            # Create data directory
            mkdir -p /var/lib/rent-coordinator
            chown rent-coordinator:rent-coordinator /var/lib/rent-coordinator

            # Try to restore latest database from S3
            echo "Checking for latest database backup in S3..."

            # Use AWS CLI to find and restore the latest backup
            LATEST_BACKUP=$(aws s3 ls s3://${BackupBucket}/database/ \
              --region ${AWS::Region} \
              --recursive | \
              grep '\.db$' | \
              sort | \
              tail -n 1 | \
              awk '{print $4}')

            if [ -n "$LATEST_BACKUP" ]; then
              echo "Found backup: $LATEST_BACKUP"
              echo "Downloading backup from S3..."

              # Download to temporary location
              aws s3 cp s3://${BackupBucket}/$LATEST_BACKUP \
                /var/lib/rent-coordinator/tenant-coordinator.db \
                --region ${AWS::Region}

              # Set ownership
              chown rent-coordinator:rent-coordinator /var/lib/rent-coordinator/tenant-coordinator.db

              echo "Database restored successfully from S3"
            else
              echo "No backups found in S3, starting with fresh database"
            fi

            # Apply database migrations against the restored (or fresh) DB.
            # Migrations are idempotent — safe to re-run on every boot — and
            # this is the only place that closes the gap between an old S3
            # backup's schema and the schema the deployed code expects.
            echo "Applying database migrations..."
            sudo -u rent-coordinator bash -c '
              cd /opt/rent-coordinator
              . ~/.nvm/nvm.sh
              nvm use >/dev/null
              set -a && . .env && set +a
              for migration in $(ls migrations/*.coffee | sort); do
                echo "Running migration: $migration"
                npx coffee "$migration"
              done
            '

            # Create SysVInit service
            mkdir -p /var/log/rent-coordinator
            chown rent-coordinator:rent-coordinator /var/log/rent-coordinator

            cat > /etc/init.d/rent-coordinator << 'INITEOF'
            #!/bin/sh
            ### BEGIN INIT INFO
            # Provides:          rent-coordinator
            # Required-Start:    $network $remote_fs $syslog
            # Required-Stop:     $network $remote_fs $syslog
            # Default-Start:     2 3 4 5
            # Default-Stop:      0 1 6
            # Short-Description: RentCoordinator Application
            ### END INIT INFO
            NVM_DIR=/home/rent-coordinator/.nvm
            APP_DIR=/opt/rent-coordinator
            LOGFILE=/var/log/rent-coordinator/application.log
            PIDFILE=/var/run/rent-coordinator.pid
            USER=rent-coordinator
            . /lib/lsb/init-functions
            do_start() {
              start-stop-daemon --start --quiet --pidfile $PIDFILE \
                --chuid $USER --background --make-pidfile \
                --exec /bin/bash -- -c \
                "cd $APP_DIR && set -a && . $APP_DIR/.env && set +a && . $NVM_DIR/nvm.sh && nvm use && exec npx coffee main.coffee >> $LOGFILE 2>&1"
            }
            do_stop() {
              start-stop-daemon --stop --quiet --retry=TERM/30/KILL/5 --pidfile $PIDFILE
              rm -f $PIDFILE
            }
            case "$1" in
              start)   do_start ;;
              stop)    do_stop ;;
              restart) do_stop; sleep 1; do_start ;;
              status)  status_of_proc -p $PIDFILE /bin/bash rent-coordinator && exit 0 || exit $? ;;
              *)       echo "Usage: $0 {start|stop|restart|status}" >&2; exit 3 ;;
            esac
            INITEOF

            chmod +x /etc/init.d/rent-coordinator
            update-rc.d rent-coordinator defaults
            service rent-coordinator start

            # Wait for application to be healthy
            echo "Waiting for application to start..."
            for i in {1..30}; do
              if curl -f http://localhost:8080/health > /dev/null 2>&1; then
                echo "Application is healthy!"
                break
              fi
              echo "Attempt $i: Application not ready yet..."
              sleep 2
            done

            # Set up automated daily backups at 2 AM UTC
            echo "Setting up automated daily backups..."
            sudo -u rent-coordinator bash -c 'cat > /tmp/backup-cron.txt << "CRONEOF"
            0 2 * * * cd /opt/rent-coordinator && bash scripts/backup-now.sh >> /var/log/rent-coordinator-backup.log 2>&1
            CRONEOF
            crontab /tmp/backup-cron.txt
            rm /tmp/backup-cron.txt'

            echo "Automated backups configured (daily at 2 AM UTC)"

            # Create initial backup
            echo "Creating initial backup..."
            sleep 5  # Give the app a moment to fully initialize
            sudo -u rent-coordinator bash -c '
              cd /opt/rent-coordinator
              bash scripts/backup-now.sh
            ' || echo "Initial backup failed (app may still be initializing)"

            # Setup CloudWatch Logs
            echo "Setting up CloudWatch Logs..."
            # Log directory and file already created by init script above

            # Install CloudWatch agent (curl, since the Devuan AMI doesn't ship wget by default)
            curl -fsSLO https://s3.amazonaws.com/amazoncloudwatch-agent/debian/amd64/latest/amazon-cloudwatch-agent.deb
            dpkg -i -E ./amazon-cloudwatch-agent.deb
            rm amazon-cloudwatch-agent.deb

            # Create CloudWatch agent configuration
            mkdir -p /opt/aws/amazon-cloudwatch-agent/etc/
            cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json << 'CWCONFIGEOF'
            {
              "agent": {
                "metrics_collection_interval": 60,
                "run_as_user": "cwagent"
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {
                        "file_path": "/var/log/rent-coordinator/application.log",
                        "log_group_name": "/rent-coordinator/application",
                        "log_stream_name": "{instance_id}",
                        "timezone": "UTC"
                      }
                    ]
                  }
                }
              },
              "metrics": {
                "namespace": "RentCoordinator",
                "metrics_collected": {
                  "mem": {
                    "measurement": [
                      {
                        "name": "mem_used_percent",
                        "rename": "MemoryUsage",
                        "unit": "Percent"
                      }
                    ],
                    "metrics_collection_interval": 60
                  },
                  "disk": {
                    "measurement": [
                      {
                        "name": "used_percent",
                        "rename": "DiskUsage",
                        "unit": "Percent"
                      }
                    ],
                    "metrics_collection_interval": 60,
                    "resources": [
                      "/"
                    ]
                  }
                }
              }
            }
            CWCONFIGEOF

            # Start CloudWatch agent
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config \
              -m ec2 \
              -s \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json

            # Enable CloudWatch agent on boot
            update-rc.d amazon-cloudwatch-agent defaults

            echo "CloudWatch Logs setup complete"

            echo "RentCoordinator bootstrap completed at $(date)"

  # Auto Scaling Group
  RentCoordinatorAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub RentCoordinator-${Environment}
      VPCZoneIdentifier: !Ref SubnetIds
      LaunchTemplate:
        LaunchTemplateId: !Ref RentCoordinatorLaunchTemplate
        Version: !GetAtt RentCoordinatorLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 480
      TargetGroupARNs:
        - !Ref TargetGroupArn
      Tags:
        - Key: Name
          Value: !Sub RentCoordinator-${Environment}
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref Environment
          PropagateAtLaunch: true

  # Scaling Policies
  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref RentCoordinatorAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70.0

Outputs:
  AutoScalingGroupName:
    Description: Name of the Auto Scaling Group
    Value: !Ref RentCoordinatorAutoScalingGroup
    Export:
      Name: !Sub ${AWS::StackName}-ASG

  LaunchTemplateId:
    Description: ID of the Launch Template
    Value: !Ref RentCoordinatorLaunchTemplate
    Export:
      Name: !Sub ${AWS::StackName}-LaunchTemplate

  SecurityGroupId:
    Description: ID of the Security Group
    Value: !Ref RentCoordinatorSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroup

  InstanceRoleArn:
    Description: ARN of the IAM Role for instances
    Value: !GetAtt RentCoordinatorInstanceRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-InstanceRole

  BackupBucketName:
    Description: Name of the S3 bucket for database backups
    Value: !Ref BackupBucket
    Export:
      Name: !Sub ${AWS::StackName}-BackupBucket
